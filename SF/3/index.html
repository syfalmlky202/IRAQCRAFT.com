<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>صانع الكيب </title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f2417, #193b27);
      padding: 15px;
      color: #c4f5d6;
    }
    .card {
      background: rgba(25,59,39,0.95);
      border-radius: 20px;
      padding: 25px 20px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      border: 1px solid rgba(0, 255, 127, 0.3);
      box-shadow: 0 0 25px rgba(0,255,127,0.3);
      animation: fadeSlide 0.7s forwards;
    }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(-50px); }
      to { opacity: 1; transform: translateY(0); }
    }
    h1 {
      color: #00ff7f;
      font-size: 22px;
      margin-bottom: 20px;
      text-shadow: 0 0 12px rgba(0,255,127,0.6);
    }
    input[type="text"], textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 12px;
      border: 1.5px solid #00ff7f;
      background: rgba(0,255,127,0.05);
      color: #c4f5d6;
      font-size: 15px;
      resize: none;
    }
    .upload-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 2px dashed rgba(0,255,127,0.5);
      border-radius: 15px;
      padding: 15px;
      cursor: pointer;
      margin-bottom: 20px;
      transition: border-color 0.3s, background 0.3s, transform 0.1s;
      font-weight: bold;
      color: #c4f5d6;
    }
    .upload-box:hover {
      border-color: #00ff7f;
      background: rgba(0,255,127,0.05);
      transform: scale(1.02);
    }
    input[type=file] { display: none; }
    button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #00ff7f;
      border: none;
      padding: 12px;
      margin-top: 10px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      color: #0f2417;
      cursor: pointer;
      width: 100%;
      transition: 0.3s;
      box-shadow: 0 4px 20px rgba(0,255,127,0.3);
    }
    button:hover { 
      background: #1cff90;
      box-shadow: 0 6px 25px rgba(0,255,127,0.5);
      transform: scale(1.02);
    }
    button:active { transform: scale(0.97); }
    #steps {
      list-style: none;
      padding: 0;
      margin-top: 15px;
      text-align: right;
    }
    #steps li {
      opacity: 0;
      color: #a7e4c0;
      font-size: 15px;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    #steps li.active { opacity: 1; transform: translateX(0); }
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #00ff7f;
      color: #0f2417;
      padding: 12px 20px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,255,127,0.4);
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.5s, transform 0.5s;
      z-index: 9999;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
    canvas { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1><i class="fa-solid fa-cogs"></i> صانع الكيب </h1>

    <input type="text" id="nameInput" placeholder="اسم الريسورس باك داخل اللعبة (مهم)">
    <textarea id="descInput" rows="3" placeholder="وصف الريسورس باك داخل اللعبة (مهم)"></textarea>

    <label class="upload-box" for="imgInput">
      <i class="fa-solid fa-image"></i> اختر صورة الكيب اللعبة 
    </label>
    <input type="file" id="imgInput" accept="image/*">
    
    <label class="upload-box" for="packIconInput">
      <i class="fa-solid fa-camera"></i> اختر صورة غلاف الريسوسباك  
    </label>
    <input type="file" id="packIconInput" accept="image/*">

    <p style="font-size: 12px; color: #a7e4c0; margin-top: -10px;">
        <i class="fa-solid fa-server"></i>  يعمل 
    </p>

    <button onclick="modifyMcpack()">
      <i class="fa-solid fa-file-arrow-down"></i> صنع وحفظ الملف
    </button>

    <ul id="steps">
      <li id="step1"><i class="fa-solid fa-box"></i> تحميل ملف iraqcraft.mcpack</li>
      <li id="step2"><i class="fa-solid fa-image"></i> دمج صورة الخلفية</li>
      <li id="step3"><i class="fa-solid fa-wrench"></i> تجهيز بيانات الريسورس باك</li>
      <li id="step3b"><i class="fa-solid fa-pen-to-square"></i> تغيير الاسم والوصف</li>
      <li id="step4"><i class="fa-solid fa-floppy-disk"></i> إنشاء الملف النهائي</li>
      <li id="step5"><i class="fa-solid fa-check"></i> تم الحفظ بنجاح</li>
    </ul>
    <canvas id="canvas" width="1280" height="640"></canvas>
  </div>

  <div id="toast" class="toast"><i class="fa-solid fa-check"></i> تم صنع الريسورس باك وتحميله بنجاح</div>

  <script>
    function generateUUID() {
      // دالة لتوليد معرّف فريد (UUID) جديد
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        var r = Math.random()*16|0, v = c=='x'?r:(r&0x3|0x8);
        return v.toString(16);
      });
    }

    async function modifyMcpack() {
      const nameInput = document.getElementById('nameInput').value.trim();
      const descInput = document.getElementById('descInput').value.trim();
      const imgFile = document.getElementById('imgInput').files[0];
      const packIconFile = document.getElementById('packIconInput').files[0];
      
      const steps = [
        document.getElementById('step1'),
        document.getElementById('step2'),
        document.getElementById('step3'),
        document.getElementById('step3b'),
        document.getElementById('step4'),
        document.getElementById('step5')
      ];
      steps.forEach(s => s.classList.remove('active'));

      // التحقق من الصورتين فقط
      if (!imgFile || !packIconFile) { 
        alert("⚠️ لازم تختار صورة الخلفية وصورة الغلاف أولاً");
        return;
      }

      // **الخطوة 1 الجديدة: تحميل ملف iraqcraft.mcpack من السيرفر**
      steps[0].classList.add('active');
      await new Promise(r => setTimeout(r, 400));
      
      let mcpackBlob;
      try {
          const response = await fetch('iraqcraft.mcpack'); // المسار الثابت
          if (!response.ok) {
              throw new Error(`HTTP error! status: ${response.status}`);
          }
          mcpackBlob = await response.blob();
      } catch (error) {
          alert(`⚠️ خطأ في تحميل الملف الأساسي iraqcraft.mcpack: تأكد من وجوده في نفس المجلد. (${error.message})`);
          steps.forEach(s => s.classList.remove('active'));
          return;
      }
      // اسم الملف الأساسي للحفظ
      const mcpackFileName = 'iraqcraft.mcpack'; 

      const img = new Image();
      img.onerror = () => {
          alert("⚠️ حدث خطأ أثناء تحميل صورة الخلفية. يرجى التأكد من صلاحيتها.");
          steps.forEach(s => s.classList.remove('active'));
      };

      img.onload = async () => {
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0,0,canvas.width,canvas.height);

        // رسم الصورة مرتين بجانب بعض للخلفيات
        ctx.drawImage(img, 0, 0, 320, 320);     
        ctx.drawImage(img, 320, 0, 320, 320);   

        // الخطوة 2: دمج الصورة
        steps[1].classList.add('active');
        await new Promise(r => setTimeout(r, 400));

        // قراءة الملف المحمل
        const zipData = await JSZip.loadAsync(mcpackBlob);
        const imageData = await new Promise(resolve => canvas.toBlob(blob => resolve(blob.arrayBuffer()))); 
        const files = Object.keys(zipData.files);

        // تحميل بايتات صورة الغلاف (pack_icon.png)
        const packIconData = await packIconFile.arrayBuffer(); 

        // استبدال أيقونات الريسورس باك الرئيسية
        for (let path of files) {
          // استبدال صور الخلفية باستخدام الصورة الأولى
          if (path.endsWith("41.png") || path.endsWith("betmc_background_static.png")) {
            zipData.file(path, imageData);
          } 
          // استبدال صورة الغلاف باستخدام الصورة الثانية
          else if (path.endsWith("pack_icon.png")) { 
            zipData.file(path, packIconData);
          }
        }

        // الخطوة 3: تجهيز البيانات
        steps[2].classList.add('active');
        await new Promise(r => setTimeout(r, 400));

        // تعديل manifest.json
        const manifestFile = files.find(f => f.endsWith("manifest.json"));
        if (manifestFile) {
          const manifestContent = await zipData.file(manifestFile).async("string");
          const manifest = JSON.parse(manifestContent);

          // تغيير معرّفات UUID لتجنب التعارض في اللعبة
          manifest.header.uuid = generateUUID();
          if (manifest.modules) manifest.modules.forEach(m => m.uuid = generateUUID());

          // الخطوة 3ب: تغيير الاسم والوصف (داخل ملف الريسورس باك)
          steps[3].classList.add('active');
          await new Promise(r => setTimeout(r, 400));

          if (nameInput) manifest.header.name = nameInput;
          if (descInput) manifest.header.description = descInput;

          // حفظ التعديل داخل الـ ZIP
          zipData.file(manifestFile, JSON.stringify(manifest, null, 2));
        }

        // الخطوة 4: إنشاء الملف النهائي
        steps[4].classList.add('active');
        await new Promise(r => setTimeout(r, 400));

        // إنشاء الملف النهائي وتنزيله
        const newContent = await zipData.generateAsync({ type: "blob", mimeType: "application/octet-stream" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(newContent);
        
        // حفظ الملف بنفس الاسم الأصلي الثابت
        a.download = mcpackFileName;
        
        a.click();

        // الخطوة 5: تم الحفظ بنجاح
        steps[5].classList.add('active');

        // اظهار toast
        const toast = document.getElementById("toast");
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 3000);
      };
      // بدء تحميل الصورة الأولى
      img.src = URL.createObjectURL(imgFile);
    }
  </script>
</body>
</html>
